<main class="auth-page-container">
  <form
    class="form-main-container"
    (ngSubmit)="onSubmit()"
    [formGroup]="form"
  >
    <div class="form-container__input">
      <label class="form-label">
        <span class="label-text">Login:</span>
        <input
          class="input-field"
          type="text"
          formControlName="login"
        >
      </label>
      <label class="form-label">
        <span class="label-text">Password:</span>
        <input
          class="input-field"
          type="password"
          formControlName="password"
        >
      </label>
    </div>
    @if (errorMessage) {
      <div class="error-row error-text">
        {{ errorMessage }}
      </div>
    }
    <div class="form-row__btn">
      <button type="button" (click)="goBack()" class="btn btn-form lighting_text">Return</button>
      <button type="button" (click)="router.navigate(['registration'])" class="btn btn-form lighting_text">Registration</button>
      <button type="submit" class="btn btn-form lighting_text" >Sign-in</button>
    </div>
  </form>
</main>
