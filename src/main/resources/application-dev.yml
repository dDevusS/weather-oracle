spring:
  datasource:
    username: postgres
    password: pass
    url: jdbc:postgresql://localhost:5432/postgres
  jpa:
    properties.hibernate:
      show_sql: true

application:
  jwt:
    secret: random-generated-secret-key-for-dev-environment-only
    time-of-life:
      access-token: 30m

logging:
  level:
    com.ddevuss.weather.oracle.common.logging: debug
    com.ddevuss.weather.oracle.service.logging: debug
    com.ddevuss.weather.oracle.forecast.client.logging: debug