name: Deploying
on:
#  push:
#    branches:
#      - main
#    paths-ignore:
#      - '.github/workflows/**'
#      - 'src/main/java/com/ddevuss/weather/oracle/controller/api/docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  OPEN_WEATHER_API_KEY: ${{ secrets.OPEN_WEATHER_API_KEY }}
  OPEN_WEATHER_API_URL: ${{ secrets.OPEN_WEATHER_API_URL }}
  REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04 [Beta]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}      

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Prepare image tag
        id: img
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.SERVER_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}
            
            # Подставим переменные окружения и образ
            export IMAGE="${{ steps.img.outputs.IMAGE }}"
            export OPEN_WEATHER_API_KEY='${{ env.OPEN_WEATHER_API_KEY }}'
            export OPEN_WEATHER_API_URL='${{ env.OPEN_WEATHER_API_URL }}'
            export REFRESH_TOKEN_SECRET='${{ env.REFRESH_TOKEN_SECRET }}'

            # Создадим .env для compose (опционально)
            cat > .env <<EOF
            IMAGE=$IMAGE
            OPEN_WEATHER_API_KEY=$OPEN_WEATHER_API_KEY
            OPEN_WEATHER_API_URL=$OPEN_WEATHER_API_URL
            REFRESH_TOKEN_SECRET=$REFRESH_TOKEN_SECRET
            EOF
  
            # Тянем новый образ и перезапускаем
            docker compose -f docker-compose.prod.yml pull app || true
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f || true
