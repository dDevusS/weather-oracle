name: Deploying-frontend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build/deploy'
        required: true
        default: 'frontend'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ddevuss/weather-oracle-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs:
      image_ref: ${{ steps.out.outputs.image_ref }}
      ref_used: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Choose image ref for deploy (sha tag)
        id: out
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # чекаутим тот же ref, чтобы взять compose-файл именно из этой ветки
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.ref_used }}

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.frontend.yml"
          target: ${{ secrets.SERVER_PATH }}

      - name: Deploy (frontend only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}

            # внешняя сеть для фронта/бэка (создаётся один раз)
            docker network inspect weather-oracle-net >/dev/null 2>&1 || \
              docker network create weather-oracle-net

            # тянем ровно тот образ, который только что собрали (sha-тег)
            export IMAGE="${{ needs.build-and-push.outputs.image_ref }}"

            # если в compose указан image: ${IMAGE}
            docker compose -f docker-compose.frontend.yml pull || true
            docker compose -f docker-compose.frontend.yml up -d
            docker image prune -f || true