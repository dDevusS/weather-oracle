name: Deploying-frontend-no-docker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build/deploy'
        required: true
        default: 'frontend'

env:
  APP_NAME: frontend-weather-oracle
  BUILD_DIR: dist/weather-oracle-frontend/browser
  RELEASES_DIR: /var/www/weather-oracle/releases
  CURRENT_LINK: /var/www/weather-oracle/current

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      ref_used: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (prod)
        run: |
          npm run build -- --configuration production
          test -d "${{ env.BUILD_DIR }}" || (echo "Build dir not found" && exit 1)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-build
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-build
          path: ./build

      - name: Pack release
        run: |
          mkdir -p out
          tar -C ./build -czf "out/${{ github.sha }}.tar.gz" .

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "out/${{ github.sha }}.tar.gz"
          target: "/tmp"

      - name: Activate release (atomic symlink switch)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            RELEASES_DIR="/var/www/weather-oracle/releases"
            CURRENT_LINK="/var/www/weather-oracle/current"
            REL_ID="${{ github.sha }}"                 # <-- брать SHA из контекста
            ARCHIVE="/tmp/out/${REL_ID}.tar.gz"

            sudo install -d -m 0755 "$RELEASES_DIR" "$(dirname "$CURRENT_LINK")"
            sudo mkdir -p "$RELEASES_DIR/$REL_ID"
            sudo tar -C "$RELEASES_DIR/$REL_ID" -xzf "$ARCHIVE"
            sudo rm -f "$ARCHIVE"

            sudo ln -sfn "$RELEASES_DIR/$REL_ID" "$CURRENT_LINK"

            cd "$RELEASES_DIR"
            ls -1dt */ | tail -n +4 | xargs -r sudo rm -rf

            sudo chgrp -R www-data "$RELEASES_DIR"
            sudo find "$RELEASES_DIR" -type d -exec chmod 0755 {} \;
            sudo find "$RELEASES_DIR" -type f -exec chmod 0644 {} \;